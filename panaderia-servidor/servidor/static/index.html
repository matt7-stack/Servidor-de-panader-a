<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panadería Gestión</title>
<style>
:root{--bg:#f2f4f6;--cd:#fff;--tx:#1d2428;--mu:#667078;--ac:#243b6b;--ok:#1a7f4b;--bad:#c0392b;--bd:#dde2e7;--hi:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--cd:#1b222b;--tx:#eef1f4;--mu:#9aa5af;--ac:#8fb0ff;--ok:#4ade80;--bad:#f87171;--bd:#2c3540;--hi:#3a3118;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--cd:#1b222b;--tx:#eef1f4;--mu:#9aa5af;--ac:#8fb0ff;--ok:#4ade80;--bad:#f87171;--bd:#2c3540;--hi:#3a3118;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:720px;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 12px 88px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:16px 0 8px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.g .c{margin:0}
.k{font-size:12px;color:var(--mu)}.v{font-size:16px;font-weight:700;word-break:break-word}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.r{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);align-items:center}.r:last-child{border:0}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:3px 0 8px}
.b{background:var(--ac);color:var(--cd);border:0;border-radius:8px;padding:9px 12px;cursor:pointer;margin:2px 0}
.b.s{background:none;color:var(--ac);border:1px solid var(--ac)}
a.b{display:inline-block;text-decoration:none}
.b.x{background:none;color:var(--bad);padding:4px 8px}
.t{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.t .b{flex:1}
.al{background:var(--hi);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.bar{height:6px;background:var(--ac);border-radius:3px;margin-top:3px}
[data-a]{cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:9px 2px;font-size:11px;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:700}
#m{display:none;position:fixed;inset:0;background:#0009;z-index:9;align-items:flex-end;justify-content:center}
#mb{background:var(--cd);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
</style></head>
<body><div id="lg" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:20;align-items:center;justify-content:center"><div class="c" style="width:min(360px,92%)"><h1>Panadería Gestión</h1><input id="lgu" placeholder="Usuario" autocomplete="username"><input id="lgc" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="b" id="lgb" style="width:100%">Entrar</button><p class="bad" id="lgm"></p></div></div><h1 id="h"></h1><div id="v"></div><nav id="n"></nav><div id="m"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),T=new Date().toISOString().slice(0,10);
let S={rol:''},US=[],ME=null,B={},POOL=[],QS=Promise.resolve(),REF=null,LAST='',DIRTY=0,tab='ini',sub='ins',mas='prov',mes=T.slice(0,7),fn;
const g=n=>Math.round(n).toLocaleString('es-PY')+' Gs',q=n=>(+n).toLocaleString('es-PY',{maximumFractionDigits:2}),
esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),
nm=(a,i)=>esc((a.find(x=>x.id==i)||{}).n||'—'),id=()=>{if(POOL.length<150)refill();if(!POOL.length)throw new Error('Sin identificadores disponibles; recarga la página.');return POOL.shift()},
mm=(k,b=mes)=>{const[y,m]=b.split('-'),d=new Date(+y,m-1-k,15);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')},
sum=a=>a.reduce((s,x)=>s+x.m,0),
tot=(m,t)=>sum(S.movs.filter(x=>!x.an&&x.t==t&&x.f.startsWith(m))),
opts=a=>a.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join(''),
save=()=>{DIRTY++;QS=QS.then(flush).catch(()=>{}).then(()=>{DIRTY--})},
sel=(a,i)=>opts(a).replace('value="'+i+'"','value="'+i+'" selected'),
paidM=(e,m)=>S.pe.find(p=>p.e==e.id&&p.mes==m&&!p.an&&(!p.t||p.t=='sueldo')),
pend=()=>S.emp.filter(e=>e.act&&!paidM(e,T.slice(0,7))&&+T.slice(8)>=e.dia-3),
dm=n=>{const d=new Date(T+'T12:00:00');d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)},
un=(p,a,b)=>S.movs.filter(x=>!x.an&&x.o=='venta'&&x.pro==p.id&&x.f>=a&&x.f<=b).reduce((s,x)=>s+x.q,0),
sug=p=>un(p,dm(7),dm(7))||Math.round(un(p,dm(7),dm(1))/7),
cst=p=>p.rc.reduce((s,r)=>s+r.q*((S.ins.find(i=>i.id==r.i)||{}).cp||0),0),
dias=i=>{const c=S.sm.filter(x=>x.i==i.id&&x.t=='consumo'&&x.f>=dm(30)).reduce((s,x)=>s-x.q,0)/30;return c>0?i.st/c:null},
pb=(t,x,m)=>+m?`<div class="c"><div class="r" style="border:0;padding:0"><span>${t}</span><span>${g(x)} / ${g(m)}</span></div><div class="bar" style="width:${Math.min(100,Math.max(0,x/m*100))}%"></div></div>`:'',
RL={dueno:['ini','ingreso','gasto','mp','pro','mas'],panadero:['mp','pro','rp'],repartidor:['rp']},
ln=x=>x.n?esc(x.n):nm(S.pro,x.p),
ROT={admin:'Administrador',dueno:'Dueño',panadero:'Panadero',repartidor:'Repartidor'},
NL=String.fromCharCode(10),
zn=o=>(S.dp.find(d=>d.id==o.d)||{}).z||'',
csv=r=>r.map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join(String.fromCharCode(10)),
ex=t=>M(`<h2>Copiar datos</h2><textarea id="ta" rows="10" style="width:100%" readonly>${esc(t)}</textarea><button class="b" data-a="copy">Copiar</button> <button class="b s" data-a="close">Cerrar</button>`),
L=(a,b)=>`<label class="k">${a}</label>${b}`,
BT='<button class="b">Guardar</button> <button type="button" class="b s" data-a="close">Cancelar</button>',
M=h=>{$('#mb').innerHTML=h;$('#m').style.display='flex'},
close=()=>{$('#m').style.display='none'},
ask=(t,f)=>{fn=f;M(`<p>${t}</p><button class="b" data-a="yes">Sí</button> <button class="b s" data-a="close">No</button>`)};
function mov(f,t,m,c,d){S.movs.push({id:id(),f,t,m:Math.round(m),c,p:S.pagos[0].id,d,o:'manual',an:0})}
function cons(i,n,t,f=T,mo=''){const x=S.ins.find(y=>y.id==i);x.st-=n;S.sm.push({id:id(),f,i:+i,t,q:-n,mo})}
function pagar(c,f){c.pg='pagada';const m={id:id(),f,t:'gasto',m:c.tot,c:S.cats.find(x=>x.s).id,p:S.pagos[0].id,d:'Compra de materia prima #'+c.id,o:'compra',cp:c.id,an:0};c.mid=m.id;S.movs.push(m)}
function compra(f,pv,pg,l){const c={id:id(),f,pv,pg,l,an:0,tot:0};
 l.forEach(x=>{const i=S.ins.find(y=>y.id==x.i),d=i.st+x.q;i.cp=d>0?(Math.max(i.st,0)*i.cp+x.q*x.c)/(Math.max(i.st,0)+x.q):x.c;i.st=d;c.tot+=x.q*x.c;S.sm.push({id:id(),f,i:i.id,t:'compra',q:x.q,mo:'Compra #'+c.id})});
 S.comps.push(c);if(pg=='pagada')pagar(c,f)}
function seed(){S={rol:S.rol,_aj:S._aj,_ajv:S._ajv,nom:S.nom||'Mi Panadería',cats:[],pagos:[],provs:[],ins:[],comps:[],movs:[],sm:[],emp:[],pe:[],pro:[],cj:[],rc:[],pd:[],pm:[],dp:[],od:[]};
 ['Venta de pan','Palitos y otros','Encargos','Otros ingresos'].forEach(n=>S.cats.push({id:id(),n,t:'ingreso'}));
 ['Materia prima','Sueldos','Alquiler','Servicios','Mantenimiento','Otros gastos'].forEach((n,i)=>S.cats.push({id:id(),n,t:'gasto',s:!i}));
 ['Efectivo','Tarjeta','Transferencia'].forEach(n=>S.pagos.push({id:id(),n}));
 [['Molinos del Sur','0981 000 111'],['Distribuidora Dulce','0971 222 333']].forEach(([n,c])=>S.provs.push({id:id(),n,c}));
 [['Harina 000','kg',50],['Azúcar','kg',20],['Levadura','kg',3],['Manteca','kg',10]].forEach(([n,u,mn])=>S.ins.push({id:id(),n,u,st:0,mn,cp:0}));
 const[h,a,l,m]=S.ins.map(x=>x.id),[p1,p2]=S.provs.map(x=>x.id),ci=S.cats.filter(x=>x.t=='ingreso'),cg=S.cats.filter(x=>x.t=='gasto');
 for(let k=5;k>=0;k--){const f=mm(k,T.slice(0,7))+'-15',v=(k*7)%4;
  ci.forEach((c,j)=>mov(f,'ingreso',[7e6,3e6,1.5e6,4e5][j]*(1+v/20),c.id,'Ventas del mes'));
  [[1,4.5e6],[2,2e6],[3,9e5]].forEach(([j,x])=>mov(f,'gasto',x,cg[j].id,cg[j].n));
  compra(f,p1,'pagada',[{i:h,q:150,c:5200},{i:l,q:4,c:18000}])}
 compra(T,p2,'pendiente',[{i:a,q:40,c:6500},{i:m,q:15,c:32000}]);
 cons(h,860,'consumo');cons(l,22,'consumo');cons(m,12,'consumo');cons(a,5,'merma');ej();save()}
function ej(){S.movs=S.movs.filter(x=>!(x.o=='manual'&&x.d=='Sueldos'));S.emp=[];S.pe=[];S.pro=[];S.rc=[{id:id(),n:'Alquiler',m:2000000,c:S.cats.find(c=>c.n=='Alquiler').id,dia:1,ult:T.slice(0,7)}];const sm0={id:id(),f:T,t:'ingreso',m:150000,c:S.cats.find(c=>c.n=='Encargos').id,p:S.pagos[0].id,d:'Seña: Almacén Don Pedro',o:'pedido',an:0};S.movs.push(sm0);S.pd=[{id:id(),c:'Almacén Don Pedro',t:'0981 555 123',d:'Pedido semanal: 300 panes y 50 bolsas de palitos',f:dm(-1),tot:350000,sn:150000,e:'pendiente',mv:[sm0.id]}];S.pm=[];const[h,a,l,m]=S.ins.map(x=>x.id);
 [['Ana Gómez','Panadera',1800000,5],['Luis Benítez','Ayudante',1400000,5],['Marta Ríos','Cajera',1500000,10]].forEach(([n,rol,sal,dia])=>S.emp.push({id:id(),n,rol,sal,dia,act:1}));
 S.emp.forEach(e=>[2,1].forEach(k=>{const mes=mm(k,T.slice(0,7)),mv={id:id(),f:mes+'-'+String(e.dia).padStart(2,'0'),t:'gasto',m:e.sal,c:S.cats.find(c=>c.n=='Sueldos').id,p:S.pagos[0].id,d:'Sueldo: '+e.n,o:'sueldo',an:0};S.movs.push(mv);S.pe.push({id:id(),e:e.id,f:mv.f,m:e.sal,mes,nota:'',an:0,mid:mv.id})}));
 [['Pan francés',1500,[{i:h,q:0.06},{i:l,q:0.001}]],['Palitos (bolsa)',3000,[{i:h,q:0.2},{i:m,q:0.03}]],['Pan casero',8000,[{i:h,q:0.5},{i:l,q:0.01},{i:a,q:0.02}]]].forEach(([n,pr,rc],j)=>S.pro.push({id:id(),n,pr,st:[120,40,15][j],rc}));
 for(let k=1;k<=14;k++)S.pro.slice(0,2).forEach((p,j)=>{const n=[40,15][j]+(k*3)%7;S.movs.push({id:id(),f:dm(k),t:'ingreso',m:p.pr*n,c:S.cats.find(c=>c.t=='ingreso').id,p:S.pagos[0].id,d:'Venta: '+n+' × '+p.n,o:'venta',pro:p.id,q:n,an:0})});dpEj()}
const COLS=['movs','cats','pagos','provs','ins','comps','sm','emp','pe','pro','pm','pd','dp','od','rc','cj'],AJ=['nom','mv','mb','mo'];
const strip=o=>{const c={...o};delete c.ver;delete c.id;return c},
 cur=c=>c=='ajustes'?(S._aj?[{id:S._aj,ver:S._ajv,...Object.fromEntries(AJ.filter(k=>S[k]!==undefined).map(k=>[k,S[k]]))}]:[]):(S[c]||[]);
async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'panaderia'},...o});let d=null;try{d=await r.json()}catch(e){}if(r.status==401&&ME){ME=null;loginUI('Tu sesi\u00f3n termin\u00f3. Inicia sesi\u00f3n de nuevo.')}return[r.status,d]}
function refill(n=400){if(REF)return REF;REF=api('/api/ids',{method:'POST',body:JSON.stringify({n})}).then(([s,d])=>{if(s==200)for(let i=0;i<d.cuantos;i++)POOL.push(d.desde+i)}).finally(()=>{REF=null});return REF}
function snap(){B={};ME.leer.forEach(c=>{B[c]=new Map(cur(c).map(o=>[o.id,{v:o.ver,f:strip(o)}]))})}
async function cargar(fuerza){const[s,d]=await api('/api/datos');if(s!=200)return false;if(!fuerza&&DIRTY)return false;
 const txt=JSON.stringify(d),cambio=txt!==LAST;LAST=txt;COLS.forEach(c=>{S[c]=d[c]||[]});
 const a=(d.ajustes||[])[0];S._aj=a?a.id:null;S._ajv=a?a.ver:undefined;AJ.forEach(k=>{S[k]=a&&a[k]!==undefined?a[k]:(k=='nom'?'Mi Panader\u00eda':undefined)});
 snap();return cambio}
async function flush(){if(!ME)return;
 if(ME.rol=='admin'&&!S._aj&&AJ.some(k=>S[k]!==undefined&&S[k]!==''&&!(k=='nom'&&S.nom=='Mi Panader\u00eda')))S._aj=id();
 const ops=[];
 ME.leer.forEach(c=>{const b=B[c]||(B[c]=new Map()),vivos=new Set();
  cur(c).forEach(o=>{vivos.add(o.id);const f=strip(o),ant=b.get(o.id);
   if(!ant)ops.push({op:'crear',col:c,id:o.id,datos:f,_o:o,_f:f});
   else{const ch={};new Set([...Object.keys(f),...Object.keys(ant.f)]).forEach(k=>{if(JSON.stringify(f[k])!==JSON.stringify(ant.f[k]))ch[k]=f[k]===undefined?null:f[k]});
    if(Object.keys(ch).length)ops.push({op:'actualizar',col:c,id:o.id,ver:ant.v,datos:ch,_o:o,_f:f})}});
  b.forEach((v,k)=>{if(!vivos.has(k))ops.push({op:'borrar',col:c,id:k})})});
 for(let i=0;i<ops.length;i+=100){const lote=ops.slice(i,i+100);
  const[s,d]=await api('/api/lote',{method:'POST',body:JSON.stringify({ops:lote.map(({_o,_f,...r})=>r)})});
  if(s!=200){const msg=(d&&d.error)||'No se pudo guardar';await cargar(true);R();M('<p>'+esc(msg)+'</p><p class="k">Se recargaron los datos del servidor.</p><button class="b" data-a="close">Entendido</button>');return}
  lote.forEach((op,j)=>{const b=B[op.col];if(op.op=='borrar')b.delete(op.id);else{const ver=d.resultados[j].ver;b.set(op.id,{v:ver,f:op._f});if(op.col=='ajustes')S._ajv=ver;else op._o.ver=ver}})}}
async function accion(i,ac){await QS;const[s,d]=await api('/api/pedidos/'+i+'/'+ac,{method:'POST'});if(s!=200)M('<p>'+esc((d&&d.error)||'No se pudo completar')+'</p><button class="b" data-a="close">Entendido</button>');await cargar(true);R()}
async function cargarUsr(){const[s,d]=await api('/api/usuarios');if(s==200)US=d}
async function sembrar(vacio){await refill(1000);seed();if(vacio)['movs','comps','sm','ins','provs','emp','pe','pro','rc','cj','pd','pm','dp','od'].forEach(c=>S[c]=[]);save();R()}
const MUT=['new','an','pay','prod','vend','pmer','qv','edit','pagoe','adel','agui','enr','ent2','ent3','cobod','canp','delod','delrc','reset','clear','imp','bk'],
 OK={dueno:{new:['ingreso','gasto']},panadero:{new:['sm'],prod:1,pmer:1},repartidor:{enr:1,ent2:1,ent3:1}},
 SETUP='<div class="c"><h2>Primer uso</h2><p>El sistema est\u00e1 vac\u00edo. \u00bfC\u00f3mo quieres empezar?</p><button class="b" data-a="ini0">Empezar vac\u00edo, con categor\u00edas b\u00e1sicas</button> <button class="b s" data-a="ini1">Cargar datos de ejemplo</button></div>';
function ocultar(){if(ME.rol=='admin')return;const p=OK[ME.rol]||{};
 document.querySelectorAll('#v [data-a]').forEach(b=>{const[a,x]=b.dataset.a.split(':');if(!MUT.includes(a))return;if(!(p[a]&&(a!='new'||p.new.includes(x))))b.style.display='none'});
 document.querySelectorAll('#v form').forEach(f=>f.style.display='none');
 document.querySelectorAll('#v [data-ch]').forEach(i=>{if(i.dataset.ch!='mes')i.disabled=true})}
function loginUI(msg){ME=null;$('#lg').style.display='flex';$('#lgm').textContent=msg||'';$('#lgc').value=''}
async function entrar(){const[s,d]=await api('/api/login',{method:'POST',body:JSON.stringify({usuario:$('#lgu').value,clave:$('#lgc').value})});if(s!=200){$('#lgm').textContent=(d&&d.error)||'No se pudo entrar';return}await boot()}
async function boot(){const[s,me]=await api('/api/yo');if(s!=200)return loginUI();ME=me;S={rol:me.rol};POOL=[];tab=(RL[me.rol]||['ini'])[0];await refill(400);await cargar(true);$('#lg').style.display='none';document.body.className='r-'+me.rol;if(me.rol=='admin'&&S.rc.length)genRec();R()}
function dpEj(){S.dp=[{id:id(),n:'Almacén Don Pedro',t:'595981555123',z:'Centro',dir:'Av. San Blas 123'},{id:id(),n:'Despensa La Esquina',t:'595971222333',z:'Barrio Obrero',dir:'Calle 5 y Mcal. López'},{id:id(),n:'Minimarket Sol',t:'595982444555',z:'Centro',dir:'Av. Monseñor Rodríguez 456'}];const[d1,d2,d3]=S.dp.map(x=>x.id),[r1,r2]=S.pro.map(x=>x.id),mk=(d,f,l)=>({id:id(),d,f,l,tot:l.reduce((s,x)=>s+x.q*S.pro.find(p=>p.id==x.p).pr,0),e:'pendiente',cob:0});S.od=S.pro.length>1?[mk(d1,T,[{p:r1,q:200},{p:r2,q:30}]),mk(d2,T,[{p:r1,q:150},{p:r2,q:20}]),mk(d3,dm(-1),[{p:r1,q:100}])]:[];S.od.forEach(o=>o.l.forEach(x=>x.n=(S.pro.find(p=>p.id==x.p)||{}).n))}
function genRec(){if(!S.pagos.length)return;const m0=T.slice(0,7);S.rc.forEach(r=>{if(r.ult!=m0&&+T.slice(8)>=r.dia){r.ult=m0;S.movs.push({id:id(),f:m0+'-'+String(r.dia).padStart(2,'0'),t:'gasto',m:r.m,c:r.c,p:S.pagos[0].id,d:r.n,o:'rec',an:0})}});save()}
const V={
ini(){const I=tot(mes,'ingreso'),G=tot(mes,'gasto'),B=I-G,ms=[5,4,3,2,1,0].map(k=>mm(k)),mx=Math.max(1,...ms.map(m=>Math.max(tot(m,'ingreso'),tot(m,'gasto')))),
 bc=S.cats.filter(x=>x.t=='gasto').map(x=>[x.n,sum(S.movs.filter(y=>!y.an&&y.c==x.id&&y.f.startsWith(mes)))]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),
 lo=S.ins.filter(i=>i.st<=i.mn),ult=S.movs.filter(x=>!x.an).sort((a,b)=>b.f.localeCompare(a.f)||b.id-a.id).slice(0,5);
 return `<input type="month" value="${mes}" data-ch="mes">
